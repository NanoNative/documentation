<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Closed world security evidence levels</title>
  <desc id="desc">A NanoNative-style cover showing a component-level CVE alert narrowed to an affected method and then checked against the shipped executable.</desc>
  <defs>
    <linearGradient id="nanoGradient" x1="92" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC2EB"/>
      <stop offset="1" stop-color="#A6C1EE"/>
    </linearGradient>
    <linearGradient id="nanoDarkBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset=".5" stop-color="#26364B"/>
      <stop offset="1" stop-color="#40546B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1L8 4.5L1 8Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#nanoDarkBg)"/>
  <rect x="72" y="62" width="1056" height="506" rx="14" fill="transparent" stroke="#263244"/>
  <rect x="104" y="84" width="246" height="5" rx="2.5" fill="url(#nanoGradient)"/>
  <rect x="892" y="544" width="164" height="3" rx="1.5" fill="url(#nanoGradient)" opacity=".72"/>

  <text x="116" y="132" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Closed world security</text>
  <text x="116" y="168" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20">from CVE alert to artifact evidence</text>

  <g filter="url(#softShadow)">
    <rect x="104" y="214" width="306" height="248" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="128" y="248" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">level 1</text>
    <text x="128" y="276" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">CVE alert</text>

    <rect x="128" y="304" width="246" height="44" rx="8" fill="#162033" stroke="#5799EA"/>
    <text x="146" y="322" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">flagged component</text>
    <text x="146" y="340" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">library-x@1.2.3</text>

    <path d="M154 348V426" stroke="#334155" stroke-width="2"/>
    <path d="M154 379H174" stroke="#334155" stroke-width="2"/>
    <path d="M154 424H174" stroke="#334155" stroke-width="2"/>

    <rect x="174" y="362" width="176" height="34" rx="7" fill="#162033" stroke="#334155"/>
    <text x="192" y="384" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">class: CodecParser</text>

    <rect x="174" y="402" width="176" height="46" rx="7" fill="#2A1724" stroke="#FF69B4"/>
    <text x="192" y="420" fill="#E8B7D4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">affected method</text>
    <text x="192" y="439" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">parseHeader()</text>
    <rect x="306" y="411" width="32" height="18" rx="9" fill="#3A1D31" stroke="#FF69B4"/>
    <text x="313" y="424" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700">CVE</text>
  </g>

  <rect x="418" y="299" width="94" height="24" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="433" y="315" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">CVE names</text>
  <path d="M438 338H494" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="516" y="198" width="254" height="282" rx="18" fill="#111827" stroke="#5799EA" stroke-width="2"/>
    <text x="546" y="238" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">level 2</text>
    <text x="546" y="268" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">closed world check</text>

    <rect x="546" y="308" width="194" height="34" rx="7" fill="#162033" stroke="#334155"/>
    <circle cx="566" cy="325" r="6" fill="#A6C1EE"/>
    <text x="584" y="329" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">static call graph</text>

    <rect x="546" y="358" width="194" height="34" rx="7" fill="#162033" stroke="#334155"/>
    <circle cx="566" cy="375" r="6" fill="#83E85A"/>
    <text x="584" y="379" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">class-level SBOM</text>

    <rect x="546" y="408" width="194" height="34" rx="7" fill="#2A1724" stroke="#FF69B4" stroke-dasharray="6 6"/>
    <circle cx="566" cy="425" r="6" fill="#FF69B4"/>
    <text x="584" y="429" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">trace parseHeader()</text>
  </g>

  <rect x="785" y="299" width="86" height="24" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="800" y="315" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">compare</text>
  <path d="M800 338H854" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="876" y="214" width="220" height="248" rx="14" fill="#0F172A" stroke="#334155"/>
    <text x="900" y="248" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">level 3</text>
    <text x="900" y="276" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">shipped artifact</text>

    <rect x="900" y="304" width="172" height="34" rx="7" fill="#102017" stroke="#83E85A"/>
    <path d="M918 321L925 328L938 314" stroke="#83E85A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="950" y="326" fill="#A4EA82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">service flow</text>

    <rect x="900" y="352" width="172" height="34" rx="7" fill="#102017" stroke="#83E85A"/>
    <path d="M918 369L925 376L938 362" stroke="#83E85A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="950" y="374" fill="#A4EA82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">used methods</text>

    <rect x="900" y="396" width="172" height="44" rx="7" fill="#2A1724" stroke="#FF69B4" stroke-dasharray="6 6"/>
    <path d="M918 408L936 426M936 408L918 426" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
    <text x="950" y="415" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">parseHeader()</text>
    <text x="950" y="432" fill="#E8B7D4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">absent</text>
  </g>

  <rect x="116" y="504" width="700" height="38" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="142" y="529" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">CVE alert -> affected method -> shipped artifact: method absent</text>

  <g opacity=".9">
    <path d="M1062 524L1036 508L1010 524" stroke="url(#nanoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1062" cy="524" r="5" fill="#A6C1EE"/>
    <circle cx="1036" cy="508" r="5" fill="#FF69B4"/>
    <circle cx="1010" cy="524" r="5" fill="#5799EA"/>
  </g>
</svg>
