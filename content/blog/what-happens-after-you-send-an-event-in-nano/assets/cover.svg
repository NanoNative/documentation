<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Inside Nano event dispatch</title>
  <desc id="desc">An event envelope carries a typed channel, request-derived payload and context. For a non-broadcast event, dispatch visits listeners, then ready services while unacknowledged; acknowledgment stops propagation. Synchronous dispatch stays on the calling thread; asynchronous dispatch schedules the same rules on another virtual thread.</desc>
  <defs>
    <linearGradient id="nanoGradient" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC2EB"/>
      <stop offset="1" stop-color="#A6C1EE"/>
    </linearGradient>
    <linearGradient id="brand" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC2EB"/><stop offset="1" stop-color="#A6C1EE"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151A23"/><stop offset="1" stop-color="#202734"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#394355" stroke-width=".5"/>
    </pattern>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5L1 8" stroke="#A6C1EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ack" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5L1 8" stroke="#FF88C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Nano dark roles: canvas, raised/inset, primary/secondary text, link and emphasis. -->
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <rect x="40" y="158" width="1120" height="354" fill="url(#grid)" opacity=".35"/>
  <rect x="64" y="42" width="1072" height="4" rx="2" fill="url(#brand)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="103" fill="#F9F9F9" font-size="42" font-weight="700">What happens after send()?</text>
    <text x="64" y="142" fill="#B5C1D3" font-size="19">Typed channels · acknowledgment · context · virtual threads</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="64" y="178" width="286" height="318" rx="12" fill="#202734" stroke="#8090A7"/>
    <text x="84" y="208" fill="#B5C1D3" font-size="13" font-weight="600" letter-spacing="1">EVENT ENVELOPE</text>
    <text x="84" y="241" fill="#F9F9F9" font-size="18" font-weight="600">Event&lt;OrderLookup,</text>
    <text x="84" y="265" fill="#F9F9F9" font-size="18" font-weight="600">      OrderResult&gt;</text>
    <path d="M84 283H330" stroke="#394355"/>
    <g font-size="13">
      <text x="84" y="312" fill="#B5C1D3">channel</text><text x="183" y="312" fill="#FF88C2">ORDER_LOOKUP</text>
      <text x="84" y="343" fill="#B5C1D3">payload</text><text x="183" y="343" fill="#F9F9F9">orderId from path</text>
      <text x="84" y="374" fill="#B5C1D3">context</text><text x="183" y="374" fill="#F9F9F9">request context</text>
      <text x="84" y="405" fill="#B5C1D3">ctx.traceId</text><text x="183" y="405" fill="#A6C1EE">OrderController/…</text>
      <text x="84" y="436" fill="#B5C1D3">createdAt</text><text x="183" y="436" fill="#F9F9F9">nanoTime()</text>
      <text x="84" y="467" fill="#B5C1D3">broadcast</text><text x="183" y="467" fill="#F9F9F9">false</text>
    </g>
    <rect x="374" y="178" width="762" height="180" rx="12" fill="#202734" stroke="#8090A7"/>
    <text x="394" y="209" fill="#FF88C2" font-size="16" font-weight="600">SYNC / calling thread waits</text>
    <path d="M394 226H1116" stroke="#394355"/>
    <g fill="#25313F" stroke="#8090A7">
      <rect x="394" y="244" width="102" height="42" rx="6"/>
      <rect x="530" y="244" width="126" height="42" rx="6"/>
      <rect x="702" y="244" width="160" height="42" rx="6"/>
      <rect x="910" y="244" width="206" height="42" rx="6"/>
    </g>
    <g fill="#F9F9F9" font-size="14" text-anchor="middle">
      <text x="445" y="270">send()</text><text x="593" y="270">listeners</text>
      <text x="782" y="270">ready services</text><text x="1013" y="270">send() returns</text>
    </g>
    <g stroke="#A6C1EE" stroke-width="2" marker-end="url(#flow)">
      <path d="M496 265H528"/><path d="M656 265H700"/><path d="M862 265H908"/>
    </g>
    <text x="782" y="305" fill="#B5C1D3" font-size="12" text-anchor="middle">if still unacknowledged</text>
    <path d="M593 286V334H1013V288" stroke="#FF88C2" stroke-width="2" stroke-linejoin="round" marker-end="url(#ack)"/>
    <text x="802" y="325" fill="#FF88C2" font-size="12" text-anchor="middle">listener ack → skip services</text>
    <rect x="374" y="378" width="762" height="118" rx="12" fill="#202734" stroke="#8090A7"/>
    <text x="394" y="407" fill="#A6C1EE" font-size="16" font-weight="600">ASYNC / caller can continue</text>
    <g fill="#25313F" stroke="#8090A7">
      <rect x="394" y="428" width="102" height="36" rx="6"/>
      <rect x="530" y="428" width="188" height="36" rx="6"/>
      <rect x="834" y="428" width="282" height="36" rx="6"/>
    </g>
    <g fill="#F9F9F9" font-size="14" text-anchor="middle">
      <text x="445" y="451">send()</text><text x="624" y="451">caller continues</text>
      <text x="975" y="451">same dispatch rules</text>
    </g>
    <path d="M496 446H528" stroke="#A6C1EE" stroke-width="2" marker-end="url(#flow)"/>
    <path d="M445 464V484H806V446H832" stroke="#A6C1EE" stroke-width="2" stroke-linejoin="round" marker-end="url(#flow)"/>
    <text x="638" y="479" fill="#B5C1D3" font-size="12" text-anchor="middle">another virtual thread</text>
  </g>
  <path d="M64 516H856" stroke="#394355"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="548" fill="#F9F9F9" font-size="19">Same event model. Different execution timing.</text>
    <text x="64" y="577" fill="#B5C1D3" font-size="16">Channel ID = operation · trace ID = context</text>
  </g>
  <rect x="884" y="544" width="172" height="3" rx="1.5" fill="url(#nanoGradient)" opacity=".72"/>
  <g opacity=".9">
    <path d="M1062 524L1036 508L1010 524" stroke="url(#nanoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1062" cy="524" r="5" fill="#A6C1EE"/>
    <circle cx="1036" cy="508" r="5" fill="#FF69B4"/>
    <circle cx="1010" cy="524" r="5" fill="#5799EA"/>
  </g>
</svg>
