<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Railix visible application path</title>
  <desc id="desc">A dark NanoNative-style cover showing a request traveling through railix steps and branching into visible success and failure outcomes.</desc>
  <defs>
    <linearGradient id="nanoGradient" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC2EB"/>
      <stop offset="1" stop-color="#A6C1EE"/>
    </linearGradient>
    <linearGradient id="nanoDarkBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="routeGradient" x1="144" y1="330" x2="1056" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6C1EE"/>
      <stop offset=".48" stop-color="#FBC2EB"/>
      <stop offset="1" stop-color="#5799EA"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#nanoDarkBg)"/>
  <rect x="72" y="62" width="1056" height="506" rx="14" fill="transparent" stroke="#263244"/>
  <rect x="104" y="84" width="246" height="5" rx="2.5" fill="url(#nanoGradient)"/>
  <rect x="884" y="544" width="172" height="3" rx="1.5" fill="url(#nanoGradient)" opacity=".72"/>
  <g opacity=".9">
    <path d="M1062 524L1036 508L1010 524" stroke="url(#nanoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1062" cy="524" r="5" fill="#A6C1EE"/>
    <circle cx="1036" cy="508" r="5" fill="#FF69B4"/>
    <circle cx="1010" cy="524" r="5" fill="#5799EA"/>
  </g>

  <text x="116" y="132" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Railway</text>
  <text x="116" y="168" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="19">make the route from request to outcome visible</text>

  <path d="M150 338H650" stroke="#0F172A" stroke-width="26" stroke-linecap="round"/>
  <path d="M150 338H650" stroke="url(#routeGradient)" stroke-width="10" stroke-linecap="round"/>
  <path d="M650 338C728 338 744 248 830 248H1000" stroke="#0F172A" stroke-width="24" stroke-linecap="round"/>
  <path d="M650 338C728 338 744 248 830 248H1000" stroke="#83E85A" stroke-width="9" stroke-linecap="round"/>
  <path d="M650 338C728 338 744 430 830 430H1000" stroke="#0F172A" stroke-width="24" stroke-linecap="round"/>
  <path d="M650 338C728 338 744 430 830 430H1000" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="112" y="274" width="152" height="128" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="142" y="303" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">request</text>
    <text x="132" y="334" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">POST /orders</text>
    <text x="132" y="361" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">payload: Order</text>
    <text x="132" y="388" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">trace_id</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="340" y="274" width="152" height="128" rx="12" fill="#162033" stroke="#5799EA"/>
    <text x="398" y="303" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">rule</text>
    <text x="360" y="334" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">auth.policy</text>
    <text x="360" y="361" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">validate(order)</text>
    <text x="360" y="388" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">repo.lookup()</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="584" y="274" width="152" height="128" rx="12" fill="#0F172A" stroke="#334155"/>
    <path d="M660 307L716 338L660 369L604 338L660 307Z" fill="#18232E" stroke="#FBC2EB" stroke-width="5" stroke-linejoin="round"/>
    <text x="620" y="393" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">decision</text>
    <text x="618" y="263" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">outcome?</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="900" y="198" width="152" height="112" rx="12" fill="#0F172A" stroke="#334155"/>
    <path d="M940 253L970 281L1016 226" stroke="#83E85A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="938" y="295" fill="#A4EA82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">accepted</text>
    <text x="918" y="222" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">200 OK</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="900" y="374" width="152" height="112" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="938" y="400" fill="#FF88C2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">rejected</text>
    <path d="M948 420L1006 458M1006 420L948 458" stroke="#FF69B4" stroke-width="12" stroke-linecap="round"/>
    <text x="918" y="474" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">403 POLICY</text>
  </g>

  <rect x="116" y="490" width="506" height="42" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="142" y="516" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">links determine execution; layout explains the graph</text>

  <circle cx="244" cy="386" r="11" fill="#A6C1EE" stroke="#0F172A" stroke-width="5"/>
  <circle cx="472" cy="386" r="11" fill="#5799EA" stroke="#0F172A" stroke-width="5"/>
  <circle cx="716" cy="386" r="11" fill="#FBC2EB" stroke="#0F172A" stroke-width="5"/>
  <circle cx="1032" cy="286" r="11" fill="#83E85A" stroke="#0F172A" stroke-width="5"/>
  <circle cx="1032" cy="456" r="11" fill="#FF69B4" stroke="#0F172A" stroke-width="5"/>
</svg>
