<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Is DX moving away from code?</title>
  <desc id="desc">A dark NanoNative-style cover comparing code-first developer experience with a Railix visual model and model review.</desc>
  <defs>
    <linearGradient id="nanoGradient" x1="92" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC2EB"/>
      <stop offset="1" stop-color="#A6C1EE"/>
    </linearGradient>
    <linearGradient id="nanoDarkBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162235"/>
      <stop offset=".52" stop-color="#26364B"/>
      <stop offset="1" stop-color="#435267"/>
    </linearGradient>
    <linearGradient id="modelFill" x1="430" y1="214" x2="790" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#17263A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity=".34"/>
    </filter>
    <filter id="tightGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#A6C1EE" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#nanoDarkBg)"/>
  <rect x="72" y="62" width="1056" height="506" rx="14" fill="transparent" stroke="#263244"/>
  <rect x="104" y="84" width="246" height="5" rx="2.5" fill="url(#nanoGradient)"/>
  <rect x="884" y="544" width="172" height="3" rx="1.5" fill="url(#nanoGradient)" opacity=".72"/>

  <text x="116" y="132" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Is DX moving away from code?</text>
  <text x="116" y="168" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20">from reading code to seeing the system</text>

  <rect x="112" y="202" width="216" height="28" rx="7" fill="#0F172A" stroke="#263244"/>
  <text x="150" y="221" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">legacy DX</text>
  <rect x="430" y="178" width="360" height="28" rx="7" fill="#161E31" stroke="#FBC2EB" stroke-opacity=".45"/>
  <text x="558" y="197" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Railix DX</text>
  <rect x="908" y="202" width="180" height="28" rx="7" fill="#0F172A" stroke="#263244"/>
  <text x="948" y="221" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">model review</text>

  <g filter="url(#softShadow)">
    <rect x="112" y="238" width="216" height="224" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="144" y="276" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">codebase</text>
    <rect x="144" y="312" width="124" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="144" y="340" width="154" height="10" rx="5" fill="#5799EA"/>
    <rect x="144" y="368" width="94" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="144" y="396" width="132" height="10" rx="5" fill="#FBC2EB"/>
    <path d="M138 314C128 314 124 322 124 350C124 378 128 386 138 386" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <path d="M292 314C302 314 306 322 306 350C306 378 302 386 292 386" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <rect x="144" y="424" width="126" height="24" rx="6" fill="#162033" stroke="#263244"/>
    <text x="176" y="441" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">clean code</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="430" y="214" width="360" height="272" rx="18" fill="url(#modelFill)" stroke="#FBC2EB" stroke-width="2"/>
    <rect x="456" y="244" width="308" height="208" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="482" y="278" fill="#FBC2EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">Railix visual model</text>

    <path d="M514 356H594" stroke="#A6C1EE" stroke-width="8" stroke-linecap="round"/>
    <path d="M646 356C690 356 688 314 726 314" stroke="#83E85A" stroke-width="8" stroke-linecap="round"/>
    <path d="M646 356C690 356 688 404 726 404" stroke="#FF69B4" stroke-width="8" stroke-linecap="round"/>

    <g filter="url(#tightGlow)">
      <rect x="486" y="324" width="58" height="58" rx="12" fill="#162033" stroke="#A6C1EE" stroke-width="4"/>
      <path d="M610 322L650 356L610 390L570 356L610 322Z" fill="#162033" stroke="#FBC2EB" stroke-width="5" stroke-linejoin="round"/>
      <rect x="708" y="286" width="58" height="58" rx="12" fill="#102017" stroke="#83E85A" stroke-width="4"/>
      <rect x="708" y="376" width="58" height="58" rx="12" fill="#211525" stroke="#FF69B4" stroke-width="4"/>
    </g>

    <text x="492" y="415" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">input</text>
    <text x="582" y="415" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">decision</text>
    <text x="712" y="277" fill="#A4EA82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ok</text>
    <text x="708" y="461" fill="#FF88C2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">failure</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="908" y="238" width="180" height="224" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="946" y="276" fill="#A6C1EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">review</text>
    <rect x="940" y="312" width="112" height="32" rx="8" fill="#162033" stroke="#334155"/>
    <rect x="940" y="362" width="112" height="32" rx="8" fill="#162033" stroke="#334155"/>
    <rect x="940" y="412" width="112" height="32" rx="8" fill="#162033" stroke="#334155"/>
    <path d="M920 328L930 338L948 316" stroke="#83E85A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M920 378L930 388L948 366" stroke="#83E85A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M920 428L930 438L948 416" stroke="#83E85A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="968" y="333" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">flows</text>
    <text x="968" y="383" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">steps</text>
    <text x="964" y="433" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">examples</text>
  </g>

  <rect x="116" y="500" width="760" height="42" rx="7" fill="#0F172A" stroke="#334155"/>
  <text x="142" y="526" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">what costs more: building features or passing the mental model across teams?</text>

  <g opacity=".9">
    <path d="M1062 524L1036 508L1010 524" stroke="url(#nanoGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1062" cy="524" r="5" fill="#A6C1EE"/>
    <circle cx="1036" cy="508" r="5" fill="#FF69B4"/>
    <circle cx="1010" cy="524" r="5" fill="#5799EA"/>
  </g>
</svg>
